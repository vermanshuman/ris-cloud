<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
<ui:composition template="/resources/tpl/Admin/ListBase.xhtml">
	<ui:param name="displayControlPanel" value="false" />

	<ui:define name="in_list_edit_body">
		<p:panel header="#{bean.panelTitle} #{entity_name}"
			rendered="#{bean.canCreateInBean}" id="editPanel">

			<ui:include src="/resources/tpl/common/ValidationMessages.xhtml" />

			<center>
				<ui:insert name="edit_fields"></ui:insert>
				<div class="btn_line">
					<p:commandButton value="#{msg.save}" update=":form, messages"
						icon="ui-icon-disk" action="#{bean.pageSave}" />

					<p:commandButton value="#{msg.reset}" update="editPanel"
						icon="ui-icon-circle-close" action="#{bean.resetFields}" />
				</div>
			</center>
		</p:panel>
	</ui:define>
</ui:composition>
</html>
