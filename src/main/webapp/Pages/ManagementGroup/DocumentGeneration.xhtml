<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:pe="http://primefaces.org/ui/extensions"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title><h:outputText value="#{msg.title}"/></title>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>

    <link href="#{facesContext.externalContext.requestContextPath}/resources/styles/default.css"
          media="all" rel="stylesheet" type="text/css" />
    <link href="#{facesContext.externalContext.requestContextPath}/resources/styles/custom-styles.css"
          media="all" rel="stylesheet" type="text/css" />

    <script type="text/javascript"
            src="#{facesContext.externalContext.requestContextPath}/resources/javascript/field-formatters.js"></script>
    <script type="text/javascript"
            src="#{facesContext.externalContext.requestContextPath}/resources/javascript/locale.js"></script>
    <script type="text/javascript"
            src="#{facesContext.externalContext.requestContextPath}/resources/javascript/jquery.maskedinput.js"></script>
    <script type="text/javascript"
            src="#{facesContext.externalContext.requestContextPath}/resources/javascript/javascript_helper.js"></script>
    <script type="text/javascript"
            src="#{facesContext.externalContext.requestContextPath}/resources/javascript/menu-manager.js"></script>
    <script type="text/javascript"
            src="#{facesContext.externalContext.requestContextPath}/resources/javascript/cookie-manager.js"></script>
    <script type="text/javascript"
            src="#{facesContext.externalContext.requestContextPath}/resources/javascript/Cookie.js"></script>
    <script type="text/javascript"
            src="#{facesContext.externalContext.requestContextPath}/resources/spellchecker/spell.js"></script>

    <script type="text/javascript"
            src="#{facesContext.externalContext.requestContextPath}/resources/ckeditor/ckeditor.js"></script>
    <script type="text/javascript"
            src="#{facesContext.externalContext.requestContextPath}/resources/ckeditor/adapters/jquery.js"></script>

    <script type="text/javascript"
            src="#{facesContext.externalContext.requestContextPath}/resources/javascript/atmosphere-min.js"></script>
</h:head>

<h:body>
    <ui:param name="bean" value="#{documentGenerationBean}"/>

    <f:view locale="#{localizeBean.locale}">
        <style type="text/css">
            #myImage {
                display: block;
                max-height: 90vh !important;
                max-width: 90vw !important;
                margin: auto !important;
            }
        </style>

        <script type="text/javascript">
            var stopAutosave = false;
            let voisisDict;

            $(document).ready(function () {
				PrimeFaces.widget.DefaultCommand = PrimeFaces.widget.BaseWidget.extend({
					init: function (b) {
						this.cfg = b;
						this.id = this.cfg.id;
						this.jqId = PrimeFaces.escapeClientId(this.id);
						this.jqTarget = $(PrimeFaces.escapeClientId(this.cfg.target));
						var a = this;
						this.jqTarget.parents("form:first")
								.keypress(function (d) {
									var c = $.ui.keyCode;
									if (d.which == c.ENTER) {
										a.jqTarget.click();
										d.preventDefault()
									}
								});
						$(this.jqId + "_s").remove()
					}
				});
				timeoutAutoSave();
				loadHistoricalReports();
				initializeValue();
				enableEditor();

				setInterval(function () {
					initializeValue();
				}, 18000);

                initializeCkEditor();
            });

            function updateCkEditor() {
                const editor = CKEDITOR.instances['reportEditor'];
                if (editor) {
                    try {
                        editor.destroy(true);
                    } catch (e) {
                        console.log('Error while destroying old Editor instance', e);
                    }
                }
                initializeCkEditor();
            }

            function initializeCkEditor() {
                const editorJq = $('#reportEditor');
                if (editorJq.length === 0) {
                    console.error('Textarea with id "reportEditor" not found.');
                    return;
                }
                const configPath = "#{resource['javascript/configCKEditor.js']}";
                const cssPath = "#{resource['javascript/CKEditorStyle.css']}";

                const editorConfig = {
                    customConfig: configPath, contentsCss: cssPath,
                    height: '360px', width: 'auto'
                };
                editorJq.ckeditor(function () {
                    const editor = CKEDITOR.instances['reportEditor'];

                    configureEditorWithGlossaryCommand(editor);
                    initVoisis();
                }, editorConfig);
                removeAllTooltips('#reportEditorPanel');
            }

            function initVoisis() {
                if ('#{bean.renderVoiceRecognitionBlock}' !== 'true' || voisisDict !== undefined)
                    return;

                const ckEditor = CKEDITOR.instances['reportEditor'];
                const resourcesUrl = '#{facesContext.externalContext.requestContextPath}/resources/javascript/voisis';
                const voisisApiUrl = '#{bean.spVoiceService.spVoiceApiUrl}';
                const proxyLoginUrl = '#{facesContext.externalContext.requestContextPath}/rest/spvoiceLogin';
                const voisisUsername = '#{bean.spVoiceService.spVoiceUsername}';

                const connectCallback = function () {
                    $(".voisis-editor-button").prop('disabled', false);
                }

                const config = {
                    title: 'VoisisCloud',
                    containerElId: 'reportEditorPanel',
                    jsBaseUrl: resourcesUrl,
                    proxyLoginUrl: proxyLoginUrl,
                    onConnect: connectCallback
                };

                if (voisisUsername) {
                    voisisDict = new voisisDictation(voisisApiUrl, ckEditor, config);

                    setTimeout(function () {
                        voisisDict.connect(voisisUsername);
                    }, 2000);
                }
            }

			function insertGlossaryToEditor(glossaryText) {
				var text = glossaryText;
				if (CKEDITOR.instances['reportEditor'] &amp;&amp; text != null &amp;&amp; text.length > 0) {
					CKEDITOR.instances['reportEditor'].insertHtml(text);
				}
			}

			function timeoutAutoSave() {
				console.log(getCurrDate() + ' start set Timeout on autoSave');
				if (!stopAutosave) {
					if (typeof autoSave === 'function') {
						setTimeout(autoSave, 1000 * 60);
					}
				}
				console.log(getCurrDate() + ' finish set Timeout on autoSave');
			}

			function getCurrDate() {
				var currentdate = new Date();
				return currentdate.getDate() + "/" +
						(currentdate.getMonth() + 1) + "/" +
						currentdate.getFullYear() + " @ " +
						currentdate.getHours() + ":" +
						currentdate.getMinutes() + ":" +
						currentdate.getSeconds();
			}

			function enableSourceBtn() {
				$('.cke_button').removeClass('cke_button_disabled ').css("pointer-events", "inherit");
			}

			function initializeValue() {
				window.value = $('#reportEditor').val();
			}

			function openWeasis(urls) {
				var res = urls.split("%_del_%");
				var i = 0;
				do {
					if (res[i] === '') {
						showWarningDicom();
					} else {
						window.open(res[i], '_blank');
					}
					++i;
				} while (res[i] != null);
			}

			function changeGlossaryResult() {
				PF('glossaryResultWV').selectValue(document.getElementById('setSelectedResult').value);
			}

			function disableApplet() {
				setTimeout(function () { hideApplet(); }, 1000);
			}

			function sendSignDocument(url) {
				PF('waitSignDialogWV').show();
				window.open(url, '_blank');
				waitForResponse();
			}

			function resizeListener() {
				CKEDITOR.instances['reportEditor'].fire('fixWidth');
			}

            // old versions of Firefox treated Backspace as 'go back' button when
            // text input was not focused, this code disables this behaviour
            if (navigator.userAgent.toLowerCase().indexOf("firefox") !== -1) {
                document.addEventListener('keydown', preventBackspaceDefaultBehaviour);
            }
        </script>

        <h:form id="form" prependId="false" enctype="multipart/form-data">

            <h:inputHidden id="editorDisabledHidden"
                           value="#{bean.editorDisabled}"/>

            <h:inputHidden id="setSelectedResult" value="#{bean.selectedResult}"/>

            <h:inputHidden id="tagFormString" value="#{bean.tagFormString}"/>

            <h:inputHidden id="initialTags" value="#{bean.initialTags}"/>

            <p:remoteCommand name="loadHistoricalReports" action="#{bean.fillHistoryDocuments}"
                             update=":form:historicalReportsPanel"/>

            <p:remoteCommand name="hideApplet" action="#{bean.hideApplet}"/>

            <p:remoteCommand name="waitForResponse" action="#{bean.waitForResponse}" update="messages"
                             oncomplete="PF('waitSignDialogWV').hide();"/>

            <p:remoteCommand name="showWarningDicom" action="#{bean.showWarningDicom}" update="messages"/>

            <p:remoteCommand name="goToWorklist"
                             actionListener="#{bean.goToWorklist}"/>

            <p:remoteCommand name="enableEditor"
                             actionListener="#{bean.enableEditor}" oncomplete="openOsirix();"/>

            <p:remoteCommand name="autoSave"
                             onstart="if(stopAutosave){return false;}console.log(getCurrDate() + ' start perform autoSave');"
                             action="#{bean.autoSave}"
                             oncomplete="console.log(getCurrDate() + ' finish perform autoSave');timeoutAutoSave();"/>


            <p:remoteCommand name="openOsirix"
                             actionListener="#{bean.openOsirix}" update="bars"/>

            <p:remoteCommand name="unblock"
                             actionListener="#{bean.unblockItemsAfterLeaving}"/>

            <p:remoteCommand name="updateEnableEditorButton"
                             update="enableHtmlEditorButtonId, editorDisabledHidden, reportEditorPanel"
                             oncomplete="updateCkEditor();"/>

            <p:remoteCommand name="handleOpen" action="#{bean.handleOpen}"
                             update="glossaryModule"/>

            <pe:layout fullPage="true" widgetVar="layoutWV"
                       options="#{bean.layoutOptions}">
                <p:ajax event="resize" onstart="resizeListener();"/>

                <p:ajax event="open" listener="#{documentGenerationBean.handleOpen}"
                        onstart="PF('bui').show()" update="glossaryModule"/>

                <pe:layoutPane position="north"
                               styleContent="background: #FFF none repeat scroll 0% 0%; padding: 0px; border-radius: 0px;">

                    <div class="header">
                        <p:remoteCommand name="callLeavePage" action="#{bean.leavePage}"
                                         update=":form:messages"/>

                        <ul class="top_menu"
                            style="width: #{sessionBean.currentUser.showStatisticMenu ? '510px' : '430px'};">
                            <li class="patient_search"><p:commandLink
                                    onclick="submitReportEditorText();"
                                    oncomplete="callLeavePage();">
                                <f:setPropertyActionListener target="#{bean.linkToRedirect}"
                                                             value="PATIENT_SEARCH"/>
                                <f:setPropertyActionListener target="#{bean.requestedToLeave}"
                                                             value="#{true}"/>
                            </p:commandLink></li>

                            <li class="worklist"><p:commandLink
                                    onclick="submitReportEditorText();"
                                    oncomplete="callLeavePage();">
                                <f:setPropertyActionListener target="#{bean.linkToRedirect}"
                                                             value="WORKLIST"/>
                                <f:setPropertyActionListener target="#{bean.requestedToLeave}"
                                                             value="#{true}"/>
                            </p:commandLink></li>

                            <li class="waiting_list"><p:commandLink
                                    onclick="submitReportEditorText();"
                                    oncomplete="callLeavePage();">
                                <f:setPropertyActionListener target="#{bean.linkToRedirect}"
                                                             value="WAITINGLIST_REGISTRATION_LIST"/>
                                <f:setPropertyActionListener target="#{bean.requestedToLeave}"
                                                             value="#{true}"/>
                            </p:commandLink></li>

                            <li class="search"><p:commandLink id="search"
                                                              onclick="submitReportEditorText();"
                                                              oncomplete="callLeavePage();">
                                <f:setPropertyActionListener target="#{bean.linkToRedirect}"
                                                             value="REPORT_SEARCH"/>
                                <f:setPropertyActionListener target="#{bean.requestedToLeave}"
                                                             value="#{true}"/>
                            </p:commandLink></li>

                            <li class="settings"><p:commandLink
                                    onclick="submitReportEditorText();"
                                    oncomplete="callLeavePage();">
                                <f:setPropertyActionListener target="#{bean.linkToRedirect}"
                                                             value="APPLICATION_SETTINGS"/>
                                <f:setPropertyActionListener target="#{bean.requestedToLeave}"
                                                             value="#{true}"/>
                            </p:commandLink></li>

                            <ui:fragment
                                    rendered="#{sessionBean.currentUser.showStatisticMenu}">
                                <li class="statistic"><p:commandLink
                                        onclick="submitReportEditorText();"
                                        oncomplete="callLeavePage();">
                                    <f:setPropertyActionListener target="#{bean.linkToRedirect}"
                                                                 value="STATISTIC"/>
                                    <f:setPropertyActionListener target="#{bean.requestedToLeave}"
                                                                 value="#{true}"/>
                                </p:commandLink></li>
                            </ui:fragment>

                        </ul>

                        <ul class="user_menu">
                            <li><a class="name"
                                   href="#{facesContext.externalContext.requestContextPath}/configuration/user_profile_view/">
                                #{sessionBean.currentUser.fullname} </a></li>

                            <li><span style="padding: 5px 0px;">|</span><a
                                    class="logout"
                                    href="#{facesContext.externalContext.requestContextPath}/j_spring_security_logout">#{msg.logout}</a>
                            </li>
                        </ul>

                        <p:ajaxStatus style=" margin-top: 8px;"
                                      onsuccess="fixExpandRow(); fixCalendarInput();">
                            <f:facet name="start">
                                <p:graphicImage value="/resources/images/ajax-loader.gif"/>
                            </f:facet>

                            <f:facet name="complete">
                                <h:outputText value=""/>
                            </f:facet>
                        </p:ajaxStatus>
                        <div class="clear" style="float: none;"></div>
                    </div>
                </pe:layoutPane>

                <p:blockUI block="glossaryModule" trigger="glossaryModule"
                           widgetVar="bui">
                    <p:outputLabel value="#{msg.loading}"/>
                    <br/>
                    <p:graphicImage value="/resources/images/ajax-loader_big.gif"/>
                </p:blockUI>

                <pe:layoutPane position="west" id="glossaryLayout">
                    <f:facet name="header">
                        <h:outputText value="#{msg.glossaryHeader}"/>
                    </f:facet>

                    <p:panel id="glossaryModule">
                        <h:panelGrid columns="2" columnClasses="label, value"
                                     styleClass="grid glossary_block" id="glossaryInputValues">

                            <span> #{msg.glossaryExamType}:</span>
                            <p:selectOneMenu id="glossaryExamType"
                                             value="#{bean.selectedExamTypeId}"
                                             label="#{msg.glossaryExamType}">
                                <p:ajax update="glossaryTable"
                                        listener="#{documentGenerationBean.sortGlossaries}"/>
                                <f:selectItems value="#{bean.examTypes}"/>
                            </p:selectOneMenu>

                            <span> #{msg.glossaryExam}:</span>
                            <p:selectOneMenu id="glossaryExam" value="#{bean.selectedExam}"
                                             label="#{msg.glossaryExam}">
                                <p:ajax update="glossaryResult"
                                        listener="#{documentGenerationBean.examChange}"/>
                                <p:ajax update="glossaryTable"
                                        listener="#{documentGenerationBean.fillGlossaries}"/>
                                <f:selectItems value="#{bean.exams}"/>
                            </p:selectOneMenu>

                            <span> #{msg.glossaryResult}:</span>
                            <p:selectOneMenu id="glossaryResult" widgetVar="glossaryResultWV"
                                             value="#{bean.selectedResult}" label="#{msg.sortGlossaries}">
                                <p:ajax update="glossaryTable, setSelectedResult"
                                        listener="#{documentGenerationBean.fillGlossaries}"/>
                                <f:selectItems value="#{bean.results}"/>
                            </p:selectOneMenu>
                        </h:panelGrid>

                        <h:inputHidden id="InputHidden" value="#{bean.tempText}"/>

                        <p:dataTable id="glossaryTable" value="#{bean.glossaries}"
                                     styleClass="glossary_tbl" var="item" lazy="false"
                                     paginator="true" rowKey="#{item.id}" rows="20"
                                     paginatorAlwaysVisible="true"
                                     emptyMessage="#{msg.noRecordsFound}"
                                     paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                     widgetVar="tableWV" selection="#{bean.currentGlossary}"
                                     selectionMode="single">

                            <p:ajax event="rowSelect"
                                    oncomplete="insertGlossaryToEditor($('#InputHidden').val());"
                                    update=":form:glossaryTable, :form:InputHidden"/>

                            <p:column headerText="#{msg.glossaryTitle}"
                                      filterBy="#{item.title}" sortBy="#{item.title}">
                                <h:outputText value="#{item.title}"/>
                            </p:column>

                            <p:column headerText="#{msg.glossaryCode}"
                                      filterBy="#{item.code}" sortBy="#{item.code}">
                                <h:outputText value="#{item.code}"/>
                            </p:column>
                        </p:dataTable>

                    </p:panel>
                    <div class="btn_line">
                        <p:commandButton value="#{msg.glossaryManagmentGlossario}"
                                         actionListener="#{bean.glossaryManadgment}"
                                         disabled="#{!bean.userEqualToClosingDoc}">
                            <p:ajax event="dialogReturn" oncomplete="changeGlossaryResult();"
                                    listener="#{documentGenerationBean.fillGlossaryModule}"
                                    update=":form:glossaryModule"/>
                        </p:commandButton>
                    </div>
                </pe:layoutPane>

                <pe:layoutPane position="east">
                    <f:facet name="header">
                        <h:outputText value="#{msg.historyHeader}"/>
                    </f:facet>

                    <p:outputPanel id="historicalReportsPanel">
                        <p:outputPanel rendered="#{bean.renderHistoricalReports}">
                            <p:accordionPanel value="#{bean.historyDocuments}" var="history"
                                              activeIndex="-1">
                                <p:tab title="#{history.title}">

                                    <h:panelGrid columns="1">
                                        <p:outputLabel value="#{msg.historyDoctor}: #{history.doctor}"/>

                                        <p:outputLabel value="#{msg.historySector}: #{history.sectorDescription}"/>
                                    </h:panelGrid>

                                    <center>
                                        <p:outputLabel value="#{history.description}" style="font-weight: bold;"/>
                                    </center>

                                    <h:panelGrid columns="1">
                                        <p:outputLabel value="#{history.text}" escape="false"/>
                                        <p:column>
                                            <div class="btn_line">
                                                <p:commandButton value="#{msg.historyImmagini}"
                                                                 disabled="#{bean.disableDICOMButton}"
                                                                 action="#{bean.openDicomForHistory}">
                                                    <f:setPropertyActionListener
                                                            target="#{bean.selectedHistoryId}" value="#{history.id}"/>
                                                </p:commandButton>

                                                <p:commandButton value="#{msg.view}"
                                                                 action="#{bean.viewExitingReport}">
                                                    <f:setPropertyActionListener
                                                            target="#{bean.selectedHistoryId}" value="#{history.id}"/>
                                                </p:commandButton>
                                            </div>
                                        </p:column>
                                    </h:panelGrid>
                                </p:tab>
                            </p:accordionPanel>
                        </p:outputPanel>
                    </p:outputPanel>
                </pe:layoutPane>

                <pe:layoutPane position="south">
                </pe:layoutPane>

                <pe:layoutPane position="center">

                    <pe:layoutPane position="north">

                        <ui:fragment>
                            <h:panelGroup id="bars">
                                <h:panelGroup rendered="#{bean.showRedBar == 'true'}">
                                    <div style="background-color: red;">
                                        <p:outputLabel value="#{msg.pdfGenerationTitle}"
                                                       style="color:white; font-size:large;"/>
                                    </div>
                                </h:panelGroup>
                                <h:panelGroup rendered="#{bean.showGreenBar == 'true'}">
                                    <div style="background-color: green;">
                                        <p:outputLabel value="#{msg.pdfGenerationTitleLoadCompleted}"
                                                       style="color:white; font-size: medium;"/>
                                    </div>
                                </h:panelGroup>
                            </h:panelGroup>
                        </ui:fragment>

                        <p:panel>
                            <h:panelGrid columns="8" style="width:100%;"
                                         styleClass="doc_gen_tbl"
                                         columnClasses="small_height_label, small_height_value, small_height_label, small_height_value, small_height_label, small_height_value, small_height_label, small_height_value">

                                <h:outputText value="#{msg.pdfGenerationPatient}: "/>
                                <h:outputText
                                        value="#{bean.radiologyExamRequest.patient.fullName}"
                                        style="font-weight: bold;"/>

                                <h:outputText value="#{msg.pdfGenerationSex}: "/>
                                <h:outputText
                                        value="#{bean.radiologyExamRequest.patient.sexTypeShortValue}"
                                        style="font-weight: bold;"/>

                                <h:outputText value="#{msg.pdfGenerationBirthDate}:"/>
                                <h:outputText
                                        value="#{bean.radiologyExamRequest.patient.birthDate}"
                                        converter="dateTimeConverter" style="font-weight: bold;"/>

                                <h:outputText value="#{msg.pdfGenerationAge}: "/>
                                <h:outputText value="#{bean.radiologyExamRequest.patient.age}"
                                              style="font-weight: bold;"/>

                                <h:outputText value="#{msg.pdfGenerationAccessNumber}: "/>
                                <h:outputText style="font-weight: bold;"
                                              value="#{bean.radiologyExamRequest.accessNumber}"/>

                                <h:outputText value="#{msg.pdfGenerationExamDate}: "/>
                                <h:outputText
                                        value="#{bean.radiologyExamRequest.latestActionDate}"
                                        converter="dateTimeConverterWithMinutes" style="font-weight: bold;"/>

                                <h:outputText value=""/>
                                <h:outputText value=""/>

                                <h:outputText value="#{msg.pdfGenerationSector}: "/>

                                <h:outputText
                                        value="#{bean.radiologyExamRequest.asapSectorWithActivity}"
                                        style="font-weight: bold; max-width:365px; display:block;"/>

                                <h:outputText value="#{msg.pdfGenerationMedicalApplicant}: "/>
                                <h:outputText
                                        value="#{bean.radiologyExamRequest.requestingDoctor}"
                                        style="font-weight: bold;"/>

                                <h:outputText value="#{msg.pdfGenerationTSRM}: "/>
                                <h:outputText value="#{bean.radiologyExamRequest.trsm}"
                                              style="font-weight: bold;"/>

                                <h:outputText value=""/>
                                <h:outputText value=""/>

                                <p:outputLabel value="#{msg.pdfGenerationDICOMDownload}:"
                                               rendered="#{bean.consistInOsirixList}"/>

                                <p:progressBar widgetVar="pbAjax" ajax="true" interval="500"
                                               rendered="#{bean.consistInOsirixList}" id="progressBarOsirix"
                                               value="#{bean.progressbarValue}" labelTemplate="{value}%"
                                               styleClass="animated, progress_bar" global="false"/>
                            </h:panelGrid>
                        </p:panel>

                        <p:dataTable var="itemExp"
                                     value="#{bean.allRequestsItemsWrappers}" id="expTable"
                                     paginator="false" rowKey="#{itemExp.id}" rowIndexVar="rowIndex" lazy="false">

                            <p:column headerText="#{msg.workListAccessNumber}">
                                <h:outputText value="#{itemExp.accessNumber}"/>
                            </p:column>

                            <p:column>
                                <f:facet name="header">
                                    <h:outputText value="#{msg.pdfGenerationEsame}"/>
                                </f:facet>
                                <h:outputText value="#{itemExp.radiologyExam.description}"
                                              style="font-weight: bold;"/>
                            </p:column>

                            <p:column styleClass="bold_column">
                                <f:facet name="header">
                                    <h:outputText value="#{msg.pdfGenerationDiagnosticQuestion}"/>
                                </f:facet>
                                <h:outputText value="#{itemExp.requestDiagnosticQuestion}"
                                              style="font-weight: bold;"/>
                            </p:column>

                            <p:column>
                                <f:facet name="header">
                                    <h:outputText value="#{msg.pdfGenerationUserFullname}"/>
                                </f:facet>
                                <h:outputText value="#{itemExp.requestingDoctor}"/>
                            </p:column>

                            <p:column style="width: 50px; text-align: center">
                                <f:facet name="header">
                                    <h:outputText value="#{msg.pdfGenerationReserveDate}"/>
                                </f:facet>
                                <h:outputText value="#{itemExp.reserveDate}"
                                              converter="dateTimeConverter"/>
                            </p:column>

                            <p:column style="width: 50px; text-align: center">
                                <f:facet name="header">
                                    <h:outputText value="#{msg.pdfGenerationRequestDate}"/>
                                </f:facet>
                                <h:outputText value="#{itemExp.requestDate}"
                                              converter="dateTimeConverter"/>
                            </p:column>
                        </p:dataTable>

                        <h:panelGrid columns="10" styleClass="doc_gen_tbl" id="panel"
                                     columnClasses="#{bean.buttonsColumnClass}"
                                     style="margin-top: 4px; width: 100%">

                            <p:menuButton icon="ui-icon ui-icon-triangle-1-s"
                                          value="#{msg.pdfGenerationTools}">
                                <p:menuitem value="#{msg.glossaryManagmentGlossario}"
                                            actionListener="#{bean.glossaryManadgment}"
                                            disabled="#{!bean.userEqualToClosingDoc}"/>

                                <p:menuitem value="#{msg.pdfGenerationPrintReport}"
                                            action="#{bean.chooseTemplate}"
                                            disabled="#{!bean.canReportWorklist || !bean.userEqualToClosingDoc}"
                                            update="messages">
                                    <f:setPropertyActionListener
                                            target="#{bean.currentStateToGeneratePdf}" value="PRINT"/>
                                </p:menuitem>

                                <p:menuitem value="#{msg.pdfGenerationReleaseReport}"

        <div class="clear"></div>

        <div class="empty_block">
            <h:inputHidden id="menuItemHidden" value="#{bean.currentMenuItem}"/>
        </div>


        <h:form prependId="false">
            <h:inputHidden id="logoutSocketHidden"
                           value="#{logoutSessionBean.sessionLogoutId}"/>
            <h:inputHidden id="urgentDataMsg"
                           value="#{urgencyMessageBean.data}"/>
            <p:remoteCommand name="checkLogoutSessionSocket"
                             action="#{logoutSessionBean.checkNeedLogout}"/>
            <p:remoteCommand name="onUrgencyReceived" action="#{urgencyMessageBean.processMessage}"
                             update="receiveUrgentRequestPanel"/>

            <p:dialog id="invalidateSessionDlg" modal="true" closable="false"
                      resizable="false" rendered="#{logoutSessionBean.needRendered}"
                      draggable="false" widgetVar="invalidateSessionDlgWV">

                <h:outputText value="#{msg.onInvalidateSession}"/>
                <div class="btn_line">
                    <p:commandButton value="#{msg.ok}"
                                     onclick="PF('invalidateSessionDlgWV').hide();"/>
                </div>
            </p:dialog>
            <p:dialog modal="true" closable="false" resizable="false" draggable="false"
                      widgetVar="receiveUrgentRequestDlgWv"
                      header="#{msg.urgencyReceiveNewRequest}">
                <h:panelGrid id="receiveUrgentRequestPanel" columns="2">
                    <h:panelGrid>
                        <h:outputText value="#{urgencyMessageBean.patientFullName}"/>
                        <h:outputText value="#{urgencyMessageBean.asapSectorDescription}"/>
                        <h:outputText value="#{urgencyMessageBean.itemsDescription}" escape="false"/>
                    </h:panelGrid>
                    <h:graphicImage alt="#{urgencyMessageBean.urgency.iconName}" width="25"
                                    height="25" value="#{urgencyMessageBean.urgency.iconUrlTemp}"/>
                </h:panelGrid>
                <div class="btn_line">
                    <p:commandButton value="#{msg.ok}"
                                     onclick="PF('receiveUrgentRequestDlgWv').hide();"/>
                </div>
            </p:dialog>
        </h:form>

        <ui:include src="/resources/tpl/Admin/Include/Footer.xhtml"></ui:include>

		<script type="text/javascript">
            $(document).ready(function() {
                GetSideMenuCookie("sideMenu");
                onPageLoadGetMenuItem();

                window.mainSocket = openWebsocket();
            });

            function openWebsocket() {
                const socket = window.atmosphere;

                const endpoint = '#{facesContext.externalContext.requestContextPath}/ws/notify'
                const request = {
                    url: getAbsoluteServerUrl(endpoint).replace('/^http/', 'ws'),
                    contentType: "application/json",
                    logLevel: 'info',
                    transport: 'websocket',
                    fallbackTransport: 'long-polling',
                    onMessage: (response) => {
                        const data = response.responseBody;
                        handleMessageSocket(data);
                    }
                };
                return socket.subscribe(request);
            }

            function handleMessageSocket(data) {
                if (data.startsWith('receiveUrgentRequest')) {
                    $('#urgentDataMsg')[0].value = data;
                    onUrgencyReceived();
                } else {
                    $('#logoutSocketHidden')[0].value = data;
                    checkLogoutSessionSocket();
                }
            }

            window.onbeforeunload = function (e) {
                window.atmosphere.unsubscribe();
            };

        </script>
    </f:view>
</h:body>
