<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui"
>
<ui:composition template="/resources/tpl/Admin/LazyListTabBase.xhtml">
	<ui:param name="bean" value="#{workListBean}" />
	<ui:param name="list_title" value="#{msg.workList}" />
	<ui:param name="renderTitle" value="false" />
	<ui:param name="showEdit" value="false" />
	<ui:param name="showDelete" value="false" />
	<ui:param name="displayControlPanel" value="false" />
	<ui:param name="renderMenu" value="false" />
	<ui:param name="centerPartStyleClass" value="false" />

	<style type="text/css">
.ui-selectcheckboxmenu-trigger>.ui-icon {
	display: none !important;
}

.ui-selectcheckboxmenu-header>.ui-chkbox.ui-widget>.ui-chkbox-box.ui-widget.ui-corner-all.ui-state-default
	{
	display: none !important;
}
</style>

	<ui:define name="list_body">

		<script type="text/javascript">
			function checkDates() {
				var dateFrom = $('#filterDateFrom_input').val();
				var dateTo = $('#filterDateTo_input').val();

				var dFrom = new Date(dateFrom.substring(6) + '-'
						+ dateFrom.substring(3, 5) + '-'
						+ dateFrom.substring(0, 2));
				var dTo = new Date(dateTo.substring(6) + '-'
						+ dateTo.substring(3, 5) + '-' + dateTo.substring(0, 2));

				if (dFrom > dTo) {
					$('#filterDateTo_input').val(
							$('#filterDateFrom_input').val());
					updateCalendarTo();
				}
			}

            function disableApplet() {
                setTimeout(function() {
                    hideApplet();
                }, 1000);
            }

			var xOffset = 0;
			var yOffset = 0;

			function initPosition() {
				xOffset = PF('contextMenuWV').jq.position().left;
				yOffset = PF('contextMenuWV').jq.position().top;
			}

			function fixContextMenu() {

				PF('contextMenuWV').jq.show();
				PF('contextMenuWV').jq.css('left', xOffset);
				PF('contextMenuWV').jq.css('top', yOffset);
			}

			function beforeShow() {
				PF('contextMenuWV').jq.empty()
			}
		</script>
		<p:remoteCommand name="updateContextMenu" update=":form:contextMenu" />
		<p:remoteCommand name="hideApplet" action="#{bean.hideApplet}" />
		<p:remoteCommand name="recheckCheckBoxes" action="#{bean.recheckCheckBoxes}" update="selectedRadiologyExamTable"/>
		<p:remoteCommand name="updateCalendarTo" update=":form:filterDateTo" />
		<p:remoteCommand name="openPrintRequestsDialog" action="#{bean.openPrintRequestsDialog}" />
		<p:outputPanel id="searchPanel">

			<h:panelGrid columns="2" style="width: 100%">
				<h:panelGrid columns="7">
					<h:outputText value="#{msg.workListDataFrom}:"/>
					<p:datePicker id="filterDateFrom"
								  onkeypress="if(!searchOnEnter(event, 'searchButton')) return true;"
								  styleClass="search_group" pattern="dd/MM/yyyy"
								  locale="it" showIcon="true" focusOnSelect="true"
								  onblur="setTimeout(function(){checkDates();}, 500);check_date(this);"
								  value="#{bean.dateFrom}" monthNavigator="true"
                                  yearNavigator="select"/>

					<h:outputText value="#{msg.workListDataTo}:"/>
					<p:datePicker id="filterDateTo"
								  onkeypress="if(!searchOnEnter(event, 'searchButton')) return false;"
								  styleClass="search_group" pattern="dd/MM/yyyy"
								  locale="it" showIcon="true" focusOnSelect="true"
								  onblur="check_date(this)" value="#{bean.dateTo}"
                                  monthNavigator="true" yearNavigator="select"/>

					<p:commandButton id="diagnosticsShow"
									 value="#{msg.worklistDiagnostica}" type="button"
									 onclick="PF('diagnosticsCheckboxWV').show(); event.stopImmediatePropagation();"
									 update="table:examTypesDatatable"/>

					<p:overlayPanel id="diagnosticsCheckboxPanel" for="diagnosticsShow"
									widgetVar="diagnosticsCheckboxWV" onHide="filterTableFromPanel();"
									style="widht:300px;">

						<p:dataTable id="diagnosticsDatatable" var="diagnostic"
									 value="#{bean.allDiagnostics}" selectionMode="single"
									 selection="#{bean.selectedDiagnosticForFilter}"
									 rowKey="#{diagnostic.diagnosticId}" lazy="false">

							<p:ajax event="rowSelect"
									listener="#{workListBean.selectDiagnosticForFilter}"
									update="diagnosticsDatatable"/>

							<p:column style="width:18px">
								<f:facet name="header">
									<p:selectBooleanCheckbox
											value="#{bean.selectedAllDiagnosticsOnPanel}">
										<p:ajax update="diagnosticsDatatable" event="change"/>
									</p:selectBooleanCheckbox>
								</f:facet>
								<p:selectBooleanCheckbox value="#{diagnostic.selected}">
									<p:ajax update="diagnosticsDatatable" event="change"/>
								</p:selectBooleanCheckbox>
							</p:column>

							<p:column headerText="#{msg.worklistDiagnostica}">
								<h:outputText value="#{diagnostic.value}"/>
							</p:column>
						</p:dataTable>
					</p:overlayPanel>

					<p:commandButton value="#{msg.workListShow}" id="searchButton"
									 onclick="checkDates(); filterTableFromPanel();"
									 update=":form:examTypesDatatable,searchPanel"/>

				</h:panelGrid>
				<h:panelGrid columns="2" style="float: right;">
					<p:commandButton value="#{msg.reopenLastReport}" rendered="#{bean.currentUser.reopenLastReport}"
									 action="#{bean.reopenLastReport}" update=":form:messages"/>

					<p:commandButton value="#{msg.printDailyReport}" rendered="#{bean.currentUser.printDailyReport}"
									 action="#{bean.openPrintRequestsDialog}"
									 update=":form:messages"/>
				</h:panelGrid>
			</h:panelGrid>
		</p:outputPanel>

		<p:remoteCommand name="filterTableFromPanel"
			action="#{bean.filterTableFromPanel}"
			update=":form:table, :form:table:size" />

		<p:remoteCommand name="callFilterTableFromPanel"
			action="#{bean.callFilterTable}" />

		<p:remoteCommand name="showPopUp" action="#{bean.showPopUp}"
			update=":form:messages" />

		<p:remoteCommand name="updateTableSize" update=":form:table:size" />

		<p:remoteCommand name="updateSelectedTemplateId" update="template" />

		<p:remoteCommand name="startProduceCD" onstart="PF('showProgressBarDlgWv').show();"
						 oncomplete="PF('showProgressBarDlgWv').hide();"
						 action="#{bean.produceCD}" update=":dialogForm:dicomInfoMsg"/>

		<p:blockUI block="form" widgetVar="blockTable" />

		<p:dataTable var="item" id="table" styleClass="workListTable"
					 emptyMessage="#{msg.noRecordsFound}" selection="#{bean.selectedRow}"
					 selectionMode="single"
					 value="#{bean.showShortView ? bean.shortLazyModel : bean.lazyModel}" lazy="true" paginator="true"
					 rowKey="#{item.id}" rows="#{bean.rows}" rowIndexVar="rowIndex"
					 paginatorAlwaysVisible="true"
					 paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
					 rowsPerPageTemplate="10,20,50" widgetVar="tableWV"
					 sortBy="#{workListBean.defaultSortBy}">

			<f:facet name="header">
				<h:outputText value="#{msg.worklistListSize} [#{bean.listSize}]"
					id="size" />
			</f:facet>

			<p:ajax event="rowToggle" listener="#{workListBean.onRowToggle}" />
			<p:ajax event="filter" oncomplete="updateTableSize();" />
			<p:ajax event="contextMenu" onsuccess="initPosition();"
				oncomplete="fixContextMenu();" update=":form:contextMenu" />

			<p:column style="width:16px" exportable="false">
				<p:rowToggler />
			</p:column>

			<p:column filterBy="#{item.surname}" sortBy="#{item.surname}"
					  filterStyleClass="smallFilter" headerText="#{msg.workListSurname}">
				<div style="display: inline-flex !important;">
					<h:outputText value="#{item.surname}"
								  style="font-weight: bold; font-size: 1.1em;"/>
					<h:graphicImage value="/resources/images/warning.png" style="padding-left: 10px; width: 18px;"
									rendered="#{item.allergyAlert > 0}"/>
				</div>
			</p:column>

			<p:column filterBy="#{item.name}" sortBy="#{item.name}"
				filterStyleClass="smallFilter" headerText="#{msg.workListName}">
				<h:outputText value="#{item.name}"
					style="font-weight: bold; font-size: 1.1em;" />
			</p:column>

			<p:column sortBy="#{item.birthDate}"
				headerText="#{msg.workListBirthDate}">
				<h:outputText value="#{item.birthDate}"
					converter="dateTimeConverter" styleClass="workListSmall" />
			</p:column>

			<p:column sortBy="#{item.asapSectorDescription}"
				filterStyleClass="smallFilter" headerText="#{msg.workListSector}"
				filterBy="#{item.asapSectorDescription}">
				<span style="font-weight: bold;" class="workListSmall">#{item.asapActivityLine != null ? item.asapActivityLine:''}</span>
				<span>#{item.asapActivityLine != null ? '-':''}</span>
				<span class="workListSmall">#{item.asapSectorDescription}</span>
			</p:column>

			<p:column headerText="#{msg.workListEsame}" exportable="false"
					  filterBy="#{item.itemsDescription}" sortBy="#{item.itemsDescription}"
					  filterStyleClass="smallFilter">
				<h:outputText value="#{item.itemsDescription}" style="display: none"/>
				<p:dataGrid value="#{item.items}" columns="1"
					styleClass="myGrid verticalGrid" var="exam">
					<p:column>
						<h:outputText value="#{exam}"
							style="font-size: 1.1em; font-weight:bold;" />
					</p:column>
				</p:dataGrid>
			</p:column>

			<p:column exportable="true" style="display:none;">
				<f:facet name="header">
					<h:outputText value="#{msg.workListEsame}" />
				</f:facet>
				<h:outputText value="#{item.radiologyExamRequestItemsString}" />
			</p:column>

			<p:column headerText="#{msg.workListStanza}"
				sortBy="#{item.examTypeDescription}" styleClass="centered">
				<f:facet name="header">
					<p:commandButton id="examTypesShow" value="#{msg.workListStanza}"
						type="button"
						onclick="PF('examTypeCheckboxWV').show(); event.stopImmediatePropagation();" />
				</f:facet>
				<h:outputText value="#{item.examTypeDescription}"
					styleClass="statusLabel" style="#{item.backgroundStyle}" />
			</p:column>

			<p:column exportable="true" style="display:none;">
				<f:facet name="header">
					<h:outputText value="#{msg.workListStanza}" />
				</f:facet>
				<h:outputText value="#{item.examTypeDescription}" />
			</p:column>

			<p:column styleClass="centered"
					  filterBy="#{item.accessNumber}" sortBy="#{item.accessNumber}">
				<f:facet name="header">
					<h:outputText value="#{msg.workListAccessNumber}" />
				</f:facet>
				<h:outputText value="#{item.accessNumber}"
					style="color: red; font-weight: bold;"
					rendered="#{item.needToShowAccessNumber}" />
			</p:column>

			<p:column sortBy="#{item.latestActionPerformDate}"
				headerText="#{msg.workListData}" styleClass="centered">
				<h:outputText value="#{item.latestActionPerformDate}"
							  converter="dateTimeConverterWithMinutes" styleClass="workListSmall_newLine" />
				<br/>
				<h:outputText value="#{item.reserveDate}" rendered="#{bean.currentUser.showOrderDate}"
							  style="font-size: smaller"
							  converter="dateTimeConverterBrackets"/>
				<h:outputText value=" *" styleClass="red" rendered="#{item.showAsterisk}"/>
			</p:column>

			<p:column sortBy="#{item.urgencyId}" headerText="#{msg.workListUrg}"
				styleClass="centered">
				<f:facet name="header">
					<p:commandButton id="urgencySelectCheckboxShow"
						value="#{msg.workListUrg}" type="button"
						onclick="PF('urgencySelectCheckboxWV').show(); event.stopImmediatePropagation();" />
				</f:facet>

				<h:graphicImage alt="#{item.urgency.iconName}" width="25"
					height="25" value="#{item.urgency.iconUrlTemp}" />
			</p:column>

			<p:column headerText="#{msg.workListEtich}" styleClass="centered">
				<p:commandLink icon="ui-icon-print" action="#{bean.chooseTemplate}"
					ajax="false" update=":form:messages">
					<p:graphicImage value="/resources/images/print.png" />
					<f:setPropertyActionListener value="#{item}"
						target="#{bean.selectedRequestView}" />
				</p:commandLink>
			</p:column>

			<p:column sortBy="#{item.waitingListRegistrationState}"
				headerText="#{msg.workListStato}">
				<f:facet name="header">
					<p:commandButton id="stateSelectCheckboxShow"
						onclick="PF('stateSelectCheckboxWV').show(); event.stopImmediatePropagation();"
						value="#{msg.workListStato}" type="button" />
				</f:facet>

				<h:outputText value="#{item.waitingListRegistrationState}"
					converter="enumConverter" styleClass="statusLabel"
					style="background-color: #{item.waitingListRegistrationState.stateColor}" />
			</p:column>

			<p:column styleClass="action_column" exportable="false"
				headerText="#{msg.workListAzione}" width="125">
				<p:commandButton value="#{item.actionBtnTitle}" id="actionBut" widgetVar="actionButton#{rowIndex}"
					update=":form:aggregationDlg, :form:messages"
					action="#{bean.moveToNextState}" process="@this"
					oncomplete="callFilterTableFromPanel();"
					onclick="PF('blockTable').show(); PF('actionButton#{rowIndex}').disable()"
					rendered="#{!empty item.actionBtnTitle}"
					disabled="#{!bean.getActionButtonDisablability(item)}">
					<f:setPropertyActionListener value="#{item}"
						target="#{bean.selectedRequestView}" />
					<f:setPropertyActionListener
						value="#{item.waitingListRegistrationState}"
						target="#{bean.selectedRequestState}" />
				</p:commandButton>
			</p:column>

			<p:column headerText="#{msg.workListDoctore}"
				sortBy="#{item.referringDoctor}" filterBy="#{item.referringDoctor}"
				filterStyleClass="smallFilter" styleClass="centered">
				<h:outputText value="#{item.referringDoctor}" />
			</p:column>

			<p:rowExpansion styleClass="expansion">
				<p:panel header="#{item.expansionRowTitle}">

					<h:panelGrid columns="4" style="width:50%; margin:0 auto;"
						columnClasses="label, value, label, value" styleClass="information-in-expanded-row">

						<h:outputText value="#{msg.workListAssignUsername}:" />
						<h:outputText
							value="#{item.assignUsername}"
							styleClass="worklist-expansion-value" style="font-size: 1.2em;" />
						<h:outputText value="#{msg.workListAssignDate}:" />
						<h:outputText
							value="#{item.assignDate}"
							converter="dateTimeConverterWithMinutes"
							styleClass="worklist-expansion-value" style="font-size: 1.2em;" />

						<h:outputText value="#{msg.workListOperator}:" />
						<h:outputText
							value="#{item.radiologyExamRequestItems[0].operator}"
							styleClass="worklist-expansion-value" style="font-size: 1.2em;" />
						<h:outputText value="#{msg.workListAcceptDate}:" />
						<h:outputText
							value="#{item.radiologyExamRequestItems[0].acceptDate}"
							converter="dateTimeConverterWithMinutes"
							styleClass="worklist-expansion-value" style="font-size: 1.2em;" />


						<h:outputText value="#{msg.workListTSRM}:" />
						<h:outputText value="#{item.radiologyExamRequestItems[0].trsm}"
							styleClass="worklist-expansion-value" style="font-size: 1.2em;" />

						<h:outputText value="#{msg.workListPerformDate}:" />
						<h:outputText
							value="#{item.radiologyExamRequestItems[0].performDate}"
							converter="dateTimeConverterWithMinutes"
							styleClass="worklist-expansion-value" style="font-size: 1.2em;" />

						<h:outputText value="#{msg.workListDoctore}:" />
						<h:outputText value="#{item.referringDoctor}"
							styleClass="worklist-expansion-value" style="font-size: 1.2em;" />

						<h:outputText value="#{msg.workListReportDate}:" />
						<h:outputText
							value="#{item.radiologyExamRequestItems[0].reportDate}"
							converter="dateTimeConverterWithMinutes"
							styleClass="worklist-expansion-value" style="font-size: 1.2em;" />

						<h:outputText value="#{msg.workListSector}:" />
						<h:outputText value="#{item.asapSectorWithActivity}"
							styleClass="worklist-expansion-value" style="font-size: 1.2em;" />

						<h:outputText value="#{msg.workListTransport}:" />
						<h:outputText value="#{item.transport}"
									  styleClass="worklist-expansion-value" style="font-size: 1.2em;" />
						<h:outputText value="" />
					</h:panelGrid>

					<h:panelGrid columns="1" cellpadding="3" cellspacing="0"
						styleClass="expandTable2 #{rowIndex}">

						<p:dataTable var="itemExp"
							value="#{item.radiologyExamRequestItems}" id="expTable"
							paginator="false" rowKey="#{itemExp.id}" rowIndexVar="rowIndex" lazy="false">

							<p:column style="width:18px" rendered="#{item.showCheckBox}">
								<f:facet name="header">
									<p:selectBooleanCheckbox value="#{item.selectedAll}">
										<p:ajax update="expTable" event="change" />
									</p:selectBooleanCheckbox>
								</f:facet>
								<p:selectBooleanCheckbox value="#{itemExp.selected}">
									<p:ajax update="expTable" event="change" />
								</p:selectBooleanCheckbox>
							</p:column>

							<p:column disabled="#{item.renderPdf}" style="width:25px;">
								<p:commandLink action="#{itemExp.downloadPdf}" ajax="false"
									disabled="true">
									<p:graphicImage value="/resources/images/pdf_small.png" />
								</p:commandLink>
							</p:column>

							<p:column>
								<f:facet name="header">
									<h:outputText value="#{msg.workListEsame}" />
								</f:facet>
								<h:outputText value="#{itemExp.radiologyExam.description}"
									styleClass="worklist-expansion-value" />
							</p:column>

							<p:column styleClass="bold_column">
								<f:facet name="header">
									<h:outputText value="#{msg.workListDiagnosticQuestion}" />
								</f:facet>
								<h:outputText value="#{itemExp.diagnosticQuestion}"
									style="font-size: 1.25em" />
							</p:column>

							<p:column styleClass="bold_column">
								<f:facet name="header">
									<h:outputText value="#{msg.workListNote}" />
								</f:facet>
								<h:outputText value="#{itemExp.note}" style="font-size: 1.25em" />
							</p:column>

							<p:column style="text-align: center;">
								<f:facet name="header">
									<h:outputText value="#{msg.workListUserFullname}" />
								</f:facet>
								<h:outputText value="#{itemExp.requestingDoctor}" />
							</p:column>

							<p:column style="width: 50px; text-align: center;">
								<f:facet name="header">
									<h:outputText value="#{msg.workListReserveDate}" />
								</f:facet>
								<h:outputText value="#{itemExp.reserveDate}"
									converter="dateTimeConverterWithMinutes" />
							</p:column>

							<p:column style="width: 50px; text-align: center;">
								<f:facet name="header">
									<h:outputText value="#{msg.workListRequestDate}" />
								</f:facet>
								<h:outputText value="#{itemExp.requestDate}"
									converter="dateTimeConverterWithMinutes" />
							</p:column>

						</p:dataTable>
					</h:panelGrid>

					<h:panelGrid columns="1" cellpadding="3" cellspacing="0"
						styleClass="expandTable2" rendered="#{!empty item.requestNotes}">
						<p:dataTable var="itemNoteExp" value="#{item.requestNotes}"
							id="expNoteTable" paginator="false" rowKey="#{itemNoteExp.id}" lazy="false">

							<p:column styleClass="action_column" exportable="false">
								<p:commandButton icon="ui-icon ui-icon-pencil"
									disabled="#{!itemNoteExp.canEditAndDelete}"
									update=":form:inputNote" action="#{bean.showNoteDlg}">
									<f:setPropertyActionListener value="#{itemNoteExp.id}"
										target="#{bean.noteId}" />
								</p:commandButton>
							</p:column>

							<p:column styleClass="action_column" exportable="false">
								<p:commandButton icon="ui-icon ui-icon-close"
									oncomplete="PF('deleteNoteWV').show();"
									disabled="#{!itemNoteExp.canEditAndDelete}">
									<f:setPropertyActionListener value="#{itemNoteExp.id}"
										target="#{bean.noteId}" />
								</p:commandButton>
							</p:column>

							<p:column>
								<f:facet name="header">
									<h:outputText value="#{msg.workListNote}" />
								</f:facet>
								<h:outputText value="#{itemNoteExp.note}" />
							</p:column>

							<p:column style="text-align: center;">
								<f:facet name="header">
									<h:outputText value="#{msg.workListCreateUser}" />
								</f:facet>
								<h:outputText value="#{itemNoteExp.createUserFullName}" />
							</p:column>

							<p:column style="text-align: center;">
								<f:facet name="header">
									<h:outputText value="#{msg.workListDate}" />
								</f:facet>
								<h:outputText converter="dateTimeConverterWithMinutes"
									value="#{itemNoteExp.performDate != null ? itemNoteExp.performDate : itemNoteExp.createDate }" />
							</p:column>


						</p:dataTable>
					</h:panelGrid>

					<h:panelGrid columns="1" cellpadding="3" cellspacing="0"
								 styleClass="expandTable2" rendered="#{!empty item.allergies}">
						<p:dataTable id="allegies" var="itemAller" value="#{item.allergies}" rowKey="#{itemAller.id}">
							<p:column styleClass="action_column" exportable="false">
								<p:commandButton icon="ui-icon ui-icon-pencil" update=":form:allergyPanel, :form:validationPanel"
												 oncomplete="PF('addAllergyNoteWV').show()"
												 disabled="#{!itemAller.canEditAndDelete}"
												 action="#{bean.editAllergyDlg(item ,itemAller.id)}" lazy="false"/>
							</p:column>
							<p:column styleClass="action_column" exportable="false">
								<p:commandButton icon="ui-icon ui-icon-close"
												 update=":form:table" oncomplete="PF('tableWV').collapseAllRows()"
												 disabled="#{!itemAller.canEditAndDelete}"
												 action="#{item.removeAllergy(itemAller.id)}"/>
							</p:column>
							<p:column headerText="#{msg.workListAddAllergy}" style="text-align: center;">
								<h:outputText value="#{itemAller.allergy}"/>
							</p:column>
							<p:column headerText="#{msg.workListCreateUser}" style="text-align: center;">
								<h:outputText value="#{itemAller.createUserName}"/>
							</p:column>
							<p:column headerText="#{msg.workListDate}" style="text-align: center;">
								<h:outputText value="#{itemAller.date}" style="padding-left: 20px"
                                              converter="dateTimeConverter"/>
							</p:column>
						</p:dataTable>
					</h:panelGrid>
				</p:panel>

				<div class="btn_line">
					<p:commandButton value="#{msg.worklistToReported}" icon="ui-icon-check"
						oncomplete="filterTableFromPanel();" update=":form:messages"
						styleClass="details-button-worklist"
						action="#{bean.moveToNextState}" rendered="#{item.isAccepted}"
						disabled="#{!bean.getActionButtonDisablability(item)}">
						<f:setPropertyActionListener value="#{item}"
							target="#{bean.selectedRequestView}" />
						<f:setPropertyActionListener

					paginator="false" rowKey="#{examItem.id}" rowIndexVar="rowIndex"
					widgetVar="examsTableWV" lazy="false">

					<p:column headerText="#{msg.workListCancelExamId}">
						<h:outputText value="#{examItem.id}" />
					</p:column>

					<p:column headerText="#{msg.workListCancelExamDescription}">
						<h:outputText value="#{examItem.radiologyExam.description}" />
					</p:column>

					<p:column headerText="#{msg.workListCancelExamDate}">
						<h:outputText
							value="#{examItem.latestActionDate}"
							converter="dateTimeConverter" />
					</p:column>

					<p:column headerText="#{msg.workListCancelExamOra}">
						<h:outputText converter="dateTimeConverterHHmm"
							value="#{examItem.latestActionDate}" />
					</p:column>

					<p:column headerText="#{msg.workListCancelExamSelect}"
						style="text-align: center;">
						<p:selectBooleanCheckbox value="#{examItem.selected}">
							<p:ajax update="@this" event="change" />
						</p:selectBooleanCheckbox>
					</p:column>
				</p:dataTable>
			</p:fieldset>

			<p:fieldset legend="#{msg.workListCancelComment}">
				<p:inputTextarea id="comment" label="#{msg.workListCancelComment}"
					onkeypress="return text_area_limit(this, event, 4000)"
					onkeyup="text_area_check(this,4000);"
					style="width:99%;height:65px;" value="#{bean.comment}" />
			</p:fieldset>

			<h:panelGrid columns="2" columnClasses="label, value"
				style="text-align: center;width: 100%;">
				<span><span class="red">*</span>
					#{msg.workListCancelTemplate}:</span>

				<p:selectOneMenu id="template" value="#{bean.selectedTemplateId}"
					disabled="#{bean.disableTemplates}">
					<f:selectItems value="#{bean.templates}" />
				</p:selectOneMenu>
			</h:panelGrid>

			<div class="btn_line">
				<p:commandButton value="#{msg.workListCancelViewReport}"
					action="#{bean.showReport}" update=":form:messages" id="showReport" />

				<p:commandButton value="#{msg.workListCancelDeselect}"
					update="examsTable" action="#{bean.deselectToCancel}" />

				<p:commandButton value="#{msg.workListCancelApply}"
					action="#{bean.cancel}" update=":form:messages, :form:table" />

				<p:commandButton value="#{msg.cancel}"
					onclick="PF('cancelDlgWV').hide();" />
			</div>
		</p:dialog>


		<!-- Aggregation -->

		<p:dialog resizable="true" position="center" id="aggregationDlg"
			widgetVar="aggregationDlgWV"
			header="#{msg.workListAggregationDialogTitle}" modal="true"
			width="700" height="500" onShow="selectAllOnAggregation();recheckCheckBoxes();">

			<p:fieldset legend="#{msg.workListAggregationPatientTitle}">

				<p:dataTable var="ptAggItem" id="patientAggregationTable"
					value="#{bean.selectedRequestWrapper}" paginator="false"
					rowKey="#{ptAggItem.id}" rows="1" rowIndexVar="rowIndex"
					widgetVar="patientTableWV" lazy="false">

					<p:column headerText="#{msg.workListAggregationPatientSurname}">
						<h:outputText value="#{ptAggItem.patient.surname}" />
					</p:column>

					<p:column headerText="#{msg.workListAggregationPatientName}">
						<h:outputText value="#{ptAggItem.patient.name}" />
					</p:column>

					<p:column headerText="#{msg.workListAggregationPatientBirthDate}">
						<h:outputText value="#{ptAggItem.patient.birthDate}"
							converter="dateTimeConverter" />
					</p:column>

					<p:column headerText="#{msg.workListAggregationPatientSector}">
						<h:outputText value="#{ptAggItem.asapSectorDescription}" />
					</p:column>

					<p:column headerText="#{msg.workListAggregationPatientStanza}">
						<h:outputText value="#{ptAggItem.examType.description}" />
					</p:column>
				</p:dataTable>
			</p:fieldset>

			<p:fieldset legend="#{msg.workListAggregationRadExamSelectedTitle}">
				<p:dataTable var="selectedRadiologyExamItem"
					value="#{bean.selectedRequestWrapper.radExamRequestItemWrappers}"
					id="selectedRadiologyExamTable" paginator="false"
					rowKey="#{selectedRadiologyExamItem.id}" rowIndexVar="rowIndex" lazy="false">

					<p:column>
						<f:facet name="header">
							<h:outputText value="#{msg.workListEsame}" />
						</f:facet>
						<h:outputText
							value="#{selectedRadiologyExamItem.radiologyExam.description}" />
					</p:column>

					<p:column>
						<f:facet name="header">
							<h:outputText value="#{msg.workListUserFullname}" />
						</f:facet>
						<h:outputText
							value="#{selectedRadiologyExamItem.requestingDoctor}" />
					</p:column>

					<p:column style="width: 50px;">
						<f:facet name="header">
							<h:outputText value="#{msg.workListReserveDate}" />
						</f:facet>
						<h:outputText value="#{selectedRadiologyExamItem.reserveDate}"
							converter="dateTimeConverterWithMinutes" />
					</p:column>

					<p:column style="width: 50px;">
						<f:facet name="header">
							<h:outputText value="#{msg.workListRequestDate}" />
						</f:facet>
						<h:outputText value="#{selectedRadiologyExamItem.requestDate}"
							converter="dateTimeConverterWithMinutes" />
					</p:column>

					<p:column headerText="#{msg.workListAggregationRadExamSelect}"
						width="20">
						<p:selectBooleanCheckbox
							value="#{selectedRadiologyExamItem.selected}" disabled="#{selectedRadiologyExamItem.disabled}">
							<p:ajax update="@this" event="change" oncomplete="recheckCheckBoxes()"/>
						</p:selectBooleanCheckbox>
					</p:column>
				</p:dataTable>
			</p:fieldset>

			<p:fieldset legend="#{msg.workListAggregationRadExamForAggregation}">

				<p:dataTable var="selectedRadiologyExamsItem"
					value="#{bean.forAggregationRequestsItemsWrappers}"
					id="agregationRadiologyExamsTable" paginator="false"
					rowKey="#{selectedRadiologyExamsItem.id}" rowIndexVar="rowIndex">

					<p:column>
						<f:facet name="header">
							<h:outputText value="#{msg.workListEsame}" />
						</f:facet>
						<h:outputText
							value="#{selectedRadiologyExamsItem.radiologyExam.description}" />
					</p:column>

					<p:column>
						<f:facet name="header">
							<h:outputText value="#{msg.workListUserFullname}" />
						</f:facet>
						<h:outputText
							value="#{selectedRadiologyExamsItem.requestingDoctor}" />
					</p:column>

					<p:column style="width: 50px;">
						<f:facet name="header">
							<h:outputText value="#{msg.workListReserveDate}" />
						</f:facet>
						<h:outputText value="#{selectedRadiologyExamsItem.reserveDate}"
							converter="dateTimeConverterWithMinutes" />
					</p:column>

					<p:column style="width: 50px;">
						<f:facet name="header">
							<h:outputText value="#{msg.workListRequestDate}" />
						</f:facet>
						<h:outputText value="#{selectedRadiologyExamsItem.requestDate}"
							converter="dateTimeConverterWithMinutes" />
					</p:column>

					<p:column headerText="#{msg.workListAggregationRadExamSelect}"
						width="20">
						<p:selectBooleanCheckbox
							value="#{selectedRadiologyExamsItem.selected}">
							<p:ajax update="@this" event="change" />
						</p:selectBooleanCheckbox>
					</p:column>

				</p:dataTable>

			</p:fieldset>

			<div class="btn_line">
				<p:commandButton value="#{msg.workListAggregationRadExamUnselect}"
					update="agregationRadiologyExamsTable"
					action="#{bean.unselectItemsForAggregation}" />

				<p:commandButton value="#{bean.aggregationButtonName}"
					id="aggregateBtn" action="#{bean.aggregateAction}"
					update=":form:messages"
					oncomplete="PF('aggregationDlgWV').hide(); filterTableFromPanel();"
					ajax="false" />

				<p:commandButton value="#{msg.cancel}"
					onclick="PF('aggregationDlgWV').hide()" />
			</div>
		</p:dialog>

		<p:remoteCommand name="onHideNote" action="#{bean.onHideNoteDlg}" />

		<p:remoteCommand name="updateAggregationsDatatables"
			update="patientAggregationTable, selectedRadiologyExamTable, agregationRadiologyExamsTable" />

		<p:remoteCommand name="selectAllOnAggregation"
			action="#{bean.selectAllItemsForAggregation}"
			update="agregationRadiologyExamsTable, selectedRadiologyExamTable" />

		<!-- Aggregation -->

	</ui:define>

	<ui:define name="dialog_body">
		<p:dialog widgetVar="confirmDicomHistoryDlgWv" resizable="false" closable="false" draggable="false"
				  modal="true">
			<h:outputText value="#{msg.documentGenerationConfirmDicomHistory}"/>
			<div class="btn_line">
				<p:commandButton value="#{msg.yes}" action="#{bean.checkProduceCD}"
								 oncomplete="PF('confirmDicomHistoryDlgWv').hide();"/>
				<p:commandButton value="#{msg.no}" oncomplete="PF('confirmDicomHistoryDlgWv').hide();"/>
			</div>
		</p:dialog>
		<p:dialog widgetVar="dicomInfoDlgWv" resizable="false" closable="false" draggable="false" modal="true">
			<h:outputText value="#{bean.dicomInfoMsg}" id="dicomInfoMsg"/>
			<div class="btn_line">
				<p:commandButton value="#{msg.ok}" oncomplete="PF('dicomInfoDlgWv').hide();"/>
			</div>
		</p:dialog>
		<p:dialog widgetVar="showProgressBarDlgWv" resizable="false" closable="false" draggable="false" modal="true"
				  header="#{msg.documentGenerationProduceCDInProgress}">
			<p:graphicImage value="/resources/images/ajax-loader_big.gif"/>
		</p:dialog>
		<p:dialog widgetVar="selectRobotDlgWv" resizable="false" modal="true"
				  closable="false" id="selectRobotDlg">
			<h:panelGrid columns="2" columnClasses="label,value" styleClass="grid" id="selectRobotDlgPanel">
				<h:outputText value="#{msg.documentGenerationRobots}:"/>
				<p:selectOneMenu value="#{bean.selectRobotId}">
					<f:selectItems value="#{bean.robots}" var="r" itemLabel="#{r.description}" itemValue="#{r.id}"/>
				</p:selectOneMenu>
			</h:panelGrid>
			<div class="btn_line">
				<p:commandButton value="#{msg.ok}" oncomplete="PF('selectRobotDlgWv').hide();startProduceCD();"/>
				<p:commandButton value="#{msg.cancel}" oncomplete="PF('selectRobotDlgWv').hide();"/>
			</div>
		</p:dialog>
		<p:dialog widgetVar="addReportDialogWV" resizable="false" width="500" height="600"
				  header="#{msg.documentGenerationAddReportDialog}" modal="true"
				  closable="false" id="addReportDialog">
			<p:outputPanel id="addReportPanel" style="width: 100%;">
				<h:panelGrid columns="2" columnClasses="label_worklist, value" styleClass="grid0">
					<ui:fragment><span><span class="red">*</span><h:outputText
							value="#{msg.documentGenerationAddReportReferringDoctor}:"/></span></ui:fragment>
					<p:inputText value="#{bean.referringDoctor}" id="referringDoctor" style="width: 97%"/>

					<ui:fragment><span><span class="red">*</span><h:outputText
							value="#{msg.documentGenerationAddReportReferringDate}:"/></span></ui:fragment>
                    <p:datePicker value="#{bean.referringDate}" style="width: 97%"
                                  pattern="dd/MM/yyyy" id="referringDate" styleClass="calendar"
                                  locale="it" showIcon="true" focusOnSelect="true"
                                  monthNavigator="true" yearNavigator="select">
                        <p:ajax event="dateSelect" update="referringDate"/>
                    </p:datePicker>

					<ui:fragment><span><span class="red">*</span><h:outputText
							value="#{msg.documentGenerationAddReportExamType}:"/></span></ui:fragment>
					<p:selectOneMenu value="#{bean.selectedDocExamTypeId}" id="selectedDocExamTypeId"
									 style="width: 323px !important;">
						<f:selectItems value="#{bean.docExamTypes}"/>
						<p:ajax listener="#{bean.onExamTypeSelect}" update="selectedDocExamId"/>
					</p:selectOneMenu>

					<ui:fragment><span><span class="red">*</span><h:outputText
							value="#{msg.documentGenerationAddReportExam}:"/></span></ui:fragment>
					<p:selectManyMenu id="selectedDocExamId" value="#{bean.selectedDocExamIds}" scrollHeight="189"
									  showCheckbox="true" style="width: 98% !important;" filter="true">
						<f:selectItems value="#{bean.docExams}"/>
					</p:selectManyMenu>

					<ui:fragment><span><span class="red">*</span><h:outputText
							value="#{msg.documentGenerationAddReportDoc}:"/></span></ui:fragment>
					<ui:fragment>
						<p:fileUpload id="filePdfUploader" auto="true"
									  style="width: 100%;" widgetVar="filePdfUploaderVar"
									  cancelLabel="#{msg.cancel}" uploadLabel="#{msg.upload}"
									  label="#{msg.choose}"
									  listener="#{bean.handleDocUpload}"
									  update="docFileName">
							<p:validateFile allowTypes="/(\.|\/)(pdf)$/" />
						</p:fileUpload>
						<p:message for="filePdfUploader" showDetail="true"/>
						<br/>
						<h:outputText value="#{bean.docFileName}" id="docFileName"
									  style="min-height: 27px !important;"/>
					</ui:fragment>

				</h:panelGrid>
				<p:panel header="#{msg.workListLoadingImages}">
					<h:panelGrid columns="2" columnClasses="label_worklist, value" styleClass="grid0">
						<h:outputText value="#{msg.documentGenerationAddReportAccessionNumber}:"/>
						<p:inputText value="#{bean.accessNumber}" style="width: 97%"/>

						<h:outputText value="#{msg.documentGenerationAddReportSector}:"/>
						<p:selectOneMenu value="#{bean.selectedSectorId}" style="width: 299px !important;">
							<f:selectItems value="#{bean.docSectors}"/>
						</p:selectOneMenu>
					</h:panelGrid>
				</p:panel>
			</p:outputPanel>
			<div class="btn_line">
				<p:commandButton value="#{msg.save}" widgetVar="saveHistoricalReportWV" process="@form"
								 action="#{bean.saveNewHistoricalReport}" update="addReportPanel, :form:messages"
								 onclick="PF('saveHistoricalReportWV').disable();PF('cancelHistoricalReportWV').disable();"
								 oncomplete="PF('saveHistoricalReportWV').enable();PF('cancelHistoricalReportWV').enable();"/>
				<p:commandButton value="#{msg.cancel}" action="#{bean.cleanHistoricalReportFields}"
								 widgetVar="cancelHistoricalReportWV" update="addReportPanel" process="@form"
								 onclick="PF('saveHistoricalReportWV').disable();PF('cancelHistoricalReportWV').disable();"
								 oncomplete="PF('saveHistoricalReportWV').enable();PF('cancelHistoricalReportWV').enable();PF('addReportDialogWV').hide();"/>
			</div>
		</p:dialog>
	</ui:define>

</ui:composition>
</html>
