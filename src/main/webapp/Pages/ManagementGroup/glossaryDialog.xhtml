<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:param name="bean" value="#{glossaryDialogBean}"/>

<h:head>
    <title>#{msg.glossaryManagmentGlossario}</title>

    <link href="#{facesContext.externalContext.requestContextPath}/resources/styles/default.css"
          media="all" rel="stylesheet" type="text/css"/>

    <script type="text/javascript"
            src="#{facesContext.externalContext.requestContextPath}/resources/javascript/javascript_helper.js"></script>
    <script type="text/javascript"
            src="#{facesContext.externalContext.requestContextPath}/resources/spellchecker/spell.js"></script>
    <script src="#{facesContext.externalContext.requestContextPath}/resources/ckeditor/ckeditor.js"
            type="text/javascript"></script>
    <script src="#{facesContext.externalContext.requestContextPath}/resources/ckeditor/adapters/jquery.js"
            type="text/javascript"></script>

    <script type="text/javascript">

        $(document).ready(function () {
            initCkEditor();
        });

        function updateCkEditor() {
            const editor = CKEDITOR.instances['reportEditor'];
            if (editor) {
                try {
                    editor.destroy(true);
                } catch (e) {
                    console.log('Error while destroying old Editor instance', e);
                }
            }
            initCkEditor();
        }

        function initCkEditor() {
            const editorJq = $('#reportEditor');
            if (editorJq.length === 0) {
                console.error('Textarea with id "templateEditor" not found.');
                return;
            }
            const configPath = "#{resource['javascript/configCKEditor.js']}";
            const cssPath = "#{resource['javascript/CKEditorStyle.css']}";
            const editorConfig = {
                customConfig: configPath, contentsCss: cssPath,
                height: '307px', width: '899px'
            };
            editorJq.ckeditor(function () {
                const editor = CKEDITOR.instances['reportEditor'];
                configureEditorWithGlossaryCommand(editor);

                editor.fire('fixWidth');
            }, editorConfig);
            removeAllTooltips('#reportEditorPanel');
        }

        // old versions of Firefox treated Backspace as 'go back' button when
        // text input was not focused, this code disables this behaviour
        if (navigator.userAgent.toLowerCase().indexOf("firefox") !== -1) {
            document.addEventListener('keydown', preventBackspaceDefaultBehaviour);
        }
    </script>
</h:head>

<h:body>
    <h:form id="form" prependId="false">

        <p:panelGrid columns="1">
            <h:panelGrid columns="2" id="upGlossarioManagment"
                         style="width:900px;">
                <p:column>
                    <p:fieldset legend="#{msg.glossaryInputBlock}"
                                style="width:287px;padding-left: 5px; margin-left: 0px;">
                        <h:panelGrid columns="3" id="upInputValues">
                            <span> #{msg.glossaryExamType}:</span>
                            <p:selectOneMenu id="diagnostic"
                                             value="#{bean.selectedExamTypeId}"
                                             label="#{msg.glossaryExamType}" style="width:150px;">
                                <p:ajax update="glossaryTable"
                                        listener="#{glossaryDialogBean.sortGlossaries}"/>
                                <f:selectItems value="#{bean.examTypes}"/>
                            </p:selectOneMenu>

                            <p:column></p:column>

                            <span> #{msg.glossaryExam}:</span>
                            <p:selectOneMenu id="exam" value="#{bean.selectedExam}"
                                             label="#{msg.glossaryExam}" style="width:150px;">
                                <p:ajax update="result, glossaryTable"
                                        listener="#{glossaryDialogBean.examChange}"
                                        oncomplete="updateUpGlossarioManagment();"/>
                                <f:selectItems value="#{bean.exams}"/>
                            </p:selectOneMenu>

                            <p:column>
                                <p:commandButton icon="ui-icon-plus"
                                                 style="height: 20px; width: 20px;" action="#{bean.showExamAdd}"
                                                 update="upInputValues"/>
                                <p:commandButton icon="ui-icon-pencil"
                                                 style="height: 20px; width: 20px;"
                                                 action="#{bean.showExamEdit}" update="upInputValues"
                                                 disabled="#{bean.isSelectExam}">
                                    <f:setPropertyActionListener target="#{bean.currentExamValue}"
                                                                 value="#{bean.selectedExam}"/>
                                </p:commandButton>

                                <p:commandButton icon="ui-icon-trash"
                                                 style="height: 20px; width: 20px;" action="#{bean.removeExam}"
                                                 update="upInputValues" disabled="#{bean.isSelectExam}">
                                    <f:setPropertyActionListener target="#{bean.currentExamValue}"
                                                                 value="#{bean.selectedExam}"/>
                                </p:commandButton>
                            </p:column>

                            <p:column id="examEditEmpty" rendered="#{bean.isExamEdit}"></p:column>
                            <p:inputText maxlength="10" id="examEditInput"
                                         rendered="#{bean.isExamEdit}" value="#{bean.newExamValue}"
                                         style="width:120px;"/>

                            <p:column id="examEditButtons" rendered="#{bean.isExamEdit}">
                                <p:commandButton icon="ui-icon-check"
                                                 style="height: 20px; width: 20px;" action="#{bean.addExam}"
                                                 update="upInputValues"/>
                                <p:commandButton icon="ui-icon-close"
                                                 style="height: 20px; width: 20px;" update="upInputValues"
                                                 action="#{bean.exitExamEdit}"/>
                            </p:column>

                            <span> #{msg.glossaryResult}:</span>
                            <p:selectOneMenu id="result" value="#{bean.selectedResult}"
                                             label="#{msg.glossaryResult}" style="width:150px;">
                                <p:ajax update="glossaryTable"
                                        listener="#{glossaryDialogBean.sortGlossaries}"
                                        oncomplete="updateUpGlossarioManagment();"/>
                                <f:selectItems value="#{bean.results}"/>
                            </p:selectOneMenu>

                            <p:column>
                                <p:commandButton icon="ui-icon-plus"
                                                 style="height: 20px; width: 20px;"
                                                 action="#{bean.showResultAdd}" update="upInputValues"
                                                 disabled="#{bean.isSelectExam}"/>

                                <p:commandButton icon="ui-icon-pencil"
                                                 style="height: 20px; width: 20px;"
                                                 action="#{bean.showResultEdit}" update="upInputValues"
                                                 disabled="#{bean.isSelectResult}">
                                    <f:setPropertyActionListener
                                            target="#{bean.currentResultValue}"
                                            value="#{bean.selectedResult}"/>
                                </p:commandButton>

                                <p:commandButton icon="ui-icon-trash"
                                                 style="height: 20px; width: 20px;"
                                                 action="#{bean.removeResult}" update="upInputValues"
                                                 disabled="#{bean.isSelectResult}">
                                    <f:setPropertyActionListener
                                            target="#{bean.currentResultValue}"
                                            value="#{bean.selectedResult}"/>
                                </p:commandButton>
                            </p:column>

                            <p:column id="resultEditEmpty" rendered="#{bean.isResultEdit}"></p:column>

                            <p:inputText maxlength="10" id="resultEditInput"
                                         rendered="#{bean.isResultEdit}" value="#{bean.newResultValue}"
                                         style="width:120px;"/>

                            <p:column id="resultEditButtons" rendered="#{bean.isResultEdit}">
                                <p:commandButton icon="ui-icon-check"
                                                 style="height: 20px; width: 20px;" action="#{bean.addResult}"
                                                 update="upInputValues"/>
                                <p:commandButton icon="ui-icon-close"
                                                 style="height: 20px; width: 20px;" update="upInputValues"
                                                 action="#{bean.exitResultEdit}"/>
                            </p:column>
                        </h:panelGrid>
                    </p:fieldset>
                </p:column>

                <p:column>
                    <p:fieldset legend="#{msg.glossaryItemList}">
                        <p:dataTable id="glossaryTable" value="#{bean.glossaries}"
                                     var="item" lazy="false" paginator="true" rowKey="#{item.id}"
                                     rows="3" paginatorAlwaysVisible="true" styleClass="glossary_tbl"
                                     emptyMessage="#{msg.noRecordsFound}"
                                     paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                     widgetVar="tableWV" style="width:auto; height:215px"
                                     sortBy="#{item.title}" >

                            <p:column style="width:8%">

                                <p:commandButton icon="ui-icon-pencil" update=":form"
                                                 oncomplete="updateCkEditor()"
                                                 action="#{bean.glossaryLoad}">
                                    <f:setPropertyActionListener value="#{item.id}"
                                                                 target="#{bean.currentGlossaryToUpdate}"/>
                                </p:commandButton>

                                <p:commandButton icon="ui-icon-trash" update="glossaryTable"
                                                 action="#{bean.glossaryDelete}">
                                    <f:setPropertyActionListener value="#{item.id}"
                                                                 target="#{bean.currentGlossaryToDelete}"/>
                                </p:commandButton>

                            </p:column>

                            <p:column headerText="#{msg.glossaryTitle}"
                                      filterBy="#{item.title}" sortBy="#{item.title}">
                                <h:outputText value="#{item.title}"/>
                            </p:column>

                            <p:column headerText="#{msg.glossaryCode}"
                                      filterBy="#{item.code}" sortBy="#{item.code}">
                                <h:outputText value="#{item.code}"/>
                            </p:column>
                        </p:dataTable>
                    </p:fieldset>
                </p:column>
            </h:panelGrid>

            <p:fieldset legend="#{msg.glossarySelectedItem}" style="width:850px;"
                        id="fieldset">
                <ui:include src="/resources/tpl/common/ValidationMessages.xhtml"/>
                <h:panelGrid columns="4">

                    <span><span class="red">*</span> #{msg.glossaryTitle}: </span>
                    <p:inputText id="title" maxlength="20" value="#{bean.title}"
                                 label="#{msg.glossaryTitle}"/>

                    <span><span class="red">*</span> #{msg.glossaryCode}: </span>
                    <p:inputText id="code" maxlength="20" value="#{bean.code}"
                                 label="#{msg.glossaryCode}"/>

                </h:panelGrid>
            </p:fieldset>

            <p:column style="width:850px; height:450px;">
                <p:outputPanel id="reportEditorPanel">
                    <p:inputTextarea id="reportEditor" value="#{bean.editorValue}" />
                </p:outputPanel>
            </p:column>

            <p:column id="downButtonLine">
                <div class="btn_line">
                    <p:commandButton value="#{msg.glossaryNew}"
                                     action="#{bean.newGlossary}"
                                     update=":form:reportEditorPanel, :form:glossaryTable, messages, fieldset,
                                     reportEditorPanel, downButtonLine, newGlossary, saveMod"
                                     oncomplete="updateCkEditor();"
                                     disabled="#{bean.isEdit}" id="newGlossary"/>

                    <p:commandButton value="#{msg.glossarySaveModification}"
                                     disabled="#{bean.isNew}" action="#{bean.newGlossary}"
                                     update=":form:reportEditorPanel, :form:glossaryTable, messages, fieldset,
                                     reportEditorPanel, newGlossary, saveMod"
                                     oncomplete="updateCkEditor()"
                                     id="saveMod"/>

                    <p:commandButton value="#{msg.glossaryClose}" id="close"
                                     action="#{bean.closeDialog}"/>
                </div>
            </p:column>

        </p:panelGrid>

        <p:growl id="messages" showDetail="true"
                 widgetVar="messagesVar" globalOnly="true"/>

        <p:remoteCommand update="upGlossarioManagment"
                         name="updateUpGlossarioManagment"/>
    </h:form>
</h:body>

</html>
