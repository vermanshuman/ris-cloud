<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">
<ui:composition template="/resources/tpl/Admin/LazyListBase.xhtml">

	<ui:param name="list_title" value="#{msg.eventCalendars}"></ui:param>
	<ui:param name="bean" value="#{eventCalendarListBean}"></ui:param>
	<ui:param name="excludeColumnsInternal" value="0,1,3"></ui:param>

	<ui:define name="columns">
		<p:column sortBy="#{item.name}" filterBy="#{item.name}">
			<f:facet name="header">
				<h:outputText value="#{msg.eventCalendarName}" />
			</f:facet>
			<h:outputText value="#{item.name}" />
		</p:column>

		<p:column>
			<f:facet name="header">
				<h:outputText value="#{msg.eventCalendarWeekDaysInfo}" />
			</f:facet>
			<p:dataList var="subVar" value="#{item.weekDays}">
				#{subVar.weekdayName} (#{subVar.startTimeStr} - #{subVar.endTimeStr})
			</p:dataList>
		</p:column>
		<p:column sortBy="#{item.validationPeriodStartDate}">
			<f:facet name="header">
				<h:outputText value="#{msg.eventCalendarValidationPeriod}" />
			</f:facet>
			<h:outputText value="#{item.validationPeriodStartDate}"
				converter="dateTimeConverter" /> - 
			<h:outputText value="#{item.validationPeriodEndDate}"
				converter="dateTimeConverter" />
		</p:column>
	</ui:define>

</ui:composition>
</html>
