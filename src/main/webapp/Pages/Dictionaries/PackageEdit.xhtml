<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	template="/resources/tpl/Admin/EditBase.xhtml">
	<ui:param name="edit_title" value="#{msg.editPackage}" />
	<ui:param name="bean" value="#{packageEditBean}" />

	<ui:define name="edit_body">
		<p:fieldset legend="#{msg.general}">
			<h:panelGrid columns="2" columnClasses="label, value"
				styleClass="grid">
				<span><span class="red">*</span> #{msg.code}:</span>
				<p:inputText id="code" maxlength="20" value="#{bean.entity.code}"
					label="#{msg.code}" onkeypress="numbers_letters_only('#code');" />

				<span><span class="red">*</span> #{msg.description}:</span>
				<p:inputTextarea id="description" label="#{msg.description}"
					onkeypress="return text_area_limit(this, event, 255)"
					onkeyup="text_area_check(this,255);" maxLength="255"
					autoResize="false" value="#{bean.entity.description}" />

				<span><span class="red">*</span> #{msg.packageExamType}: </span>
				<p:selectOneMenu id="examType" value="#{bean.examTypeId}"
					label="#{msg.packageExamType}">
					<p:ajax update="source, target"
						listener="#{packageEditBean.handleExamTypeChange}" />
					<f:selectItems value="#{bean.examTypes}" />
				</p:selectOneMenu>

				<span><span class="red">*</span> #{msg.packageExams}: </span>
			</h:panelGrid>

			<p:outputPanel id="exams">
				<h:panelGrid columns="3" columnClasses="top_col,center_col,top_col"
					styleClass="grid">
					<p:fieldset legend="#{msg.packageExamsAvailable}"
						style="padding:5px;" id="availableExams">

						<p:dataTable var="item" id="source" value="#{bean.sourceExams}"
							filteredValue="#{bean.sourceFiltered}" paginator="true"
							rowKey="#{item.id}" rows="10" pageLinks="5"
							selectionMode="multiple" paginatorAlwaysVisible="false"
							selection="#{bean.sourceSelected}" lazy="false"
							paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">

							<p:column style="width:20px">
								<h:outputText id="dragIconSource"
									styleClass="ui-icon ui-icon-arrow-4 source_drag_icon" />
								<p:draggable for="dragIconSource" revert="true" />
							</p:column>

							<p:column filterBy="#{item.code}" headerText="#{msg.code}"
								sortBy="#{item.code}">
								<h:outputText value="#{item.code}" />
							</p:column>

							<p:column filterBy="#{item.description}"
								sortBy="#{item.description}" headerText="#{msg.description}">
								<h:outputText value="#{item.description}" />
							</p:column>

							<p:column sortBy="#{item.examType.description}"
								headerText="#{msg.radiologyExamType}">
								<h:outputText value="#{item.examType}" />
							</p:column>
						</p:dataTable>
					</p:fieldset>

					<p:outputPanel>

						<p:commandButton icon="ui-icon-arrow-1-e" update="source target"
							action="#{bean.add}" id="btnAdd" />
						<br />
						<p:commandButton icon="ui-icon-arrowstop-1-e"
							update="source target" action="#{bean.addAll}" id="btnAddAll" />
						<br />
						<p:commandButton icon="ui-icon-arrow-1-w" update="source target"
							action="#{bean.remove}" id="btnRemove" />
						<br />
						<p:commandButton icon="ui-icon-arrowstop-1-w"
							update="source target" action="#{bean.removeAll}"
							id="btnRemoveAll" />

					</p:outputPanel>

					<p:fieldset legend="#{msg.packageExamsSelected}" id="selectedExams"
						style="padding:5px;">
						<p:dataTable var="itemDest" id="target"
							value="#{bean.targetExams}"
							filteredValue="#{bean.targetFiltered}" paginator="true"
							rowKey="#{itemDest.id}" rows="10" paginatorAlwaysVisible="false"
							selectionMode="multiple" selection="#{bean.targetSelected}"
							pageLinks="5" lazy="false"
							paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">

							<p:column style="width:20px">
								<h:outputText id="dragIconTarget"
									styleClass="ui-icon ui-icon-arrow-4" />
								<p:draggable for="dragIconTarget" revert="true" />
							</p:column>

							<p:column headerText="#{msg.code}">
								<h:outputText value="#{itemDest.code}" />
							</p:column>

							<p:column headerText="#{msg.description}">
								<h:outputText value="#{itemDest.description}" />
							</p:column>
						</p:dataTable>
					</p:fieldset>

					<p:droppable id="dropFromSource" for="selectedExams"
						tolerance="touch" activeStyleClass="ui-state-highlight"
						datasource="source" onDrop="handleDrop"
						rendered="#{bean.showSourceDroppable}">
						<p:ajax listener="#{packageEditBean.onSourceDrop}"
							update="source target" />
					</p:droppable>

					<p:droppable id="dropFromTarget" for="availableExams"
						tolerance="touch" activeStyleClass="ui-state-highlight"
						datasource="target" onDrop="handleDrop"
						rendered="#{bean.showTargetDroppable}">
						<p:ajax listener="#{packageEditBean.onTargetDrop}"
							update="source target" />
					</p:droppable>

					<p:remoteCommand name="updateSourceDroppable"
						actionListener="#{packageEditBean.changeShowSourceDroppable}"
						update="dropFromSource dropFromTarget" />
					<p:remoteCommand name="updateTargetDroppable"
						actionListener="#{packageEditBean.changeShowTargetDroppable}"
						update="dropFromSource dropFromTarget" />

					<p:ajaxStatus
						oncomplete="addHandlerToSourceTable();addHandlerToTargetTable();" />
					<script type="text/javascript">
						$(document).ready(function() {
							addHandlerToSourceTable();
							addHandlerToTargetTable();
						});

						function addHandlerToSourceTable() {
							$(".ui-icon.ui-icon-arrow-4.source_drag_icon")
									.mousedown(function() {
										updateSourceDroppable();
									});
						}
						function addHandlerToTargetTable() {
							$(".ui-icon.ui-icon-arrow-4.target_drag_icon")
									.mousedown(function() {
										updateTargetDroppable();
									});
						}
						function handleDrop(event, ui) {
							ui.draggable.fadeOut("fast");
						}
					</script>
				</h:panelGrid>

			</p:outputPanel>

		</p:fieldset>

	</ui:define>
</ui:composition>
