<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:ui="http://java.sun.com/jsf/facelets"
	  xmlns:h="http://java.sun.com/jsf/html"
	  xmlns:p="http://primefaces.org/ui">
<ui:composition template="/resources/tpl/Admin/LazyListBase.xhtml">
	<ui:param name="list_title" value="#{msg.directReservationTitle}" />
	<ui:param name="bean" value="#{directReservationListBean}" />

	<ui:define name="columns">
		<p:column sortBy="#{item.sector.code}" filterBy="#{item.sector.code}"
			headerText="#{msg.directReservationSector}"
			filterMatchMode="contains">
			<h:outputText value="#{item.sector.code}" />
		</p:column>

		<p:column headerText="#{msg.directReservationExams}"
			exportable="false">
			<p:dataGrid value="#{item.radiologyExams}" columns="1"
				var="exam" styleClass="verticalGrid">
				<p:column>
					<h:outputText value="#{exam.description}"/>
				</p:column>
			</p:dataGrid>
		</p:column>
	</ui:define>
</ui:composition>
</html>
