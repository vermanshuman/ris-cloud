<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">
<ui:composition template="/resources/tpl/Admin/LazyListBase.xhtml">
	<ui:param name="list_title" value="#{msg.diagnosticTitle}" />
	<ui:param name="bean" value="#{diagnosticListBean}" />

	<ui:define name="columns">
		<p:column sortBy="#{item.code}" filterBy="#{item.code}"
			headerText="#{msg.code}" filterMatchMode="contains">
			<h:outputText value="#{item.code}" />
		</p:column>

		<p:column sortBy="#{item.description}" filterBy="#{item.description}"
			headerText="#{msg.description}" filterMatchMode="contains">
			<h:outputText value="#{item.description}" />
		</p:column>

		<p:column sortBy="#{item.aeTitle}" filterBy="#{item.aeTitle}"
			headerText="#{msg.diagnosticAETitle}" filterMatchMode="contains">
			<h:outputText value="#{item.aeTitle}" />
		</p:column>

		<p:column sortBy="#{item.sector.code}" filterBy="#{item.sector.id}"
			filterOptions="#{bean.sectors}" headerText="#{msg.diagnosticSector}">
			<h:outputText value="#{item.sector}" />
		</p:column>

		<p:column sortBy="#{item.ipAddress}" filterBy="#{item.ipAddress}"
			headerText="#{msg.diagnosticIpAddress}" filterMatchMode="contains">
			<h:outputText value="#{item.ipAddress}" />
		</p:column>

		<p:column sortBy="#{item.dicomPort}" filterBy="#{item.dicomPort}"
			headerText="#{msg.diagnosticDicomPort}" filterMatchMode="contains">
			<h:outputText value="#{item.dicomPort}" />
		</p:column>

		<p:column sortBy="#{item.state}" filterOptions="#{bean.states}"
			headerText="#{msg.radiologyState}" filterMatchMode="contains">
			<h:outputText value="#{item.state}" converter="enumConverter" />
		</p:column>

		<p:column exportable="false" style="width:100px"
			headerText="#{msg.diagnosticExamType}">
			<p:dataList value="#{item.examTypes}" var="re" itemType="disc">
				<h:outputText value="#{re}" />
			</p:dataList>
		</p:column>
		<p:column style="display: none;width:100px"
			headerText="#{msg.diagnosticExamType}">
			<h:outputText value="#{item.examTypesExport}" />
		</p:column>

		<p:column headerText="#{msg.diagnosticCardNumber}"
			filterMatchMode="contains" sortBy="#{item.cardNumber}"
			filterBy="#{item.cardNumber}">
			<h:outputText value="#{item.cardNumber}" />
		</p:column>

	</ui:define>
</ui:composition>
</html>
