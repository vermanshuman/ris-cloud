<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">
<ui:composition template="/resources/tpl/Admin/LazyListBase.xhtml">
	<ui:param name="list_title" value="#{msg.sectors}" />
	<ui:param name="bean" value="#{sectorListBean}" />

	<ui:define name="columns">
		<p:column sortBy="#{item.code}" filterBy="#{item.code}"
			headerText="#{msg.code}" filterMatchMode="contains">
			<h:outputText value="#{item.code}" />
		</p:column>

		<p:column sortBy="#{item.accNumPrefix}"
				  filterBy="#{item.accNumPrefix}" filterMatchMode="contains"
				  headerText="#{msg.sectorAccNumPrefix}">
			<h:outputText value="#{item.accNumPrefix}" />
		</p:column>

		<p:column sortBy="#{item.description}" filterBy="#{item.description}"
			headerText="#{msg.description}" filterMatchMode="contains">
			<h:outputText value="#{item.description}" />
		</p:column>
	</ui:define>

</ui:composition>
</html>
